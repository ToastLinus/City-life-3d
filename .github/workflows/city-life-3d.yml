name: Build CITY LIFE 3D

on:
  push:
    branches:
      - main
    paths:
      - 'MiniOpenWorld3DS/**'
      - 'tools/**'
      - '.github/workflows/city-life-3d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install terrain converter dependency
        run: python3 -m pip install rasterio
      - name: Fetch and prepare Bayreuth map and terrain
        run: |
          python3 tools/fetch_bayreuth_map.py bayreuth-osm.geojson
          python3 tools/build_bayreuth_tiles.py bayreuth-osm.geojson bayreuth-tiles.bin
          python3 tools/fetch_bayreuth_dem.py bayreuth-osm.geojson bayreuth-dem.bin
      - name: Upload map assets
        uses: actions/upload-artifact@v4
        with:
          name: CITY-LIFE-3D-map-assets
          if-no-files-found: error
          path: |
            bayreuth-tiles.bin
            bayreuth-dem.bin

  build:
    needs: prepare-map
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create game icon
        run: |
          python3 - <<'PY'
          import struct, zlib
          w = h = 48
          rows = []
          for y in range(h):
              row = bytearray()
              for x in range(w):
                  # Green landscape, blue road and a tiny car.
                  r, g, b = 42, 112, 62
                  if 17 <= x <= 30 or 17 <= y <= 30:
                      r, g, b = 65, 70, 78
                  if 22 <= x <= 26 and 4 <= y <= 43:
                      r, g, b = 230, 215, 135
                  if 8 <= x <= 16 and 8 <= y <= 15:
                      r, g, b = 195, 150, 105
                  if 29 <= x <= 39 and 31 <= y <= 39:
                      r, g, b = 55, 145, 235
                  row.extend((r, g, b))
              rows.append(b'\x00' + bytes(row))
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(b''.join(rows), 9))
          png += chunk(b'IEND', b'')
          open('MiniOpenWorld3DS/icon.png', 'wb').write(png)
          PY

      - name: Download map assets
        uses: actions/download-artifact@v4
        with:
          name: CITY-LIFE-3D-map-assets
          path: /tmp/city-life-map
      - name: Install map assets into RomFS
        run: |
          mkdir -p MiniOpenWorld3DS/romfs
          cp /tmp/city-life-map/bayreuth-tiles.bin MiniOpenWorld3DS/romfs/bayreuth-tiles.bin
          cp /tmp/city-life-map/bayreuth-dem.bin MiniOpenWorld3DS/romfs/bayreuth-dem.bin

      - name: Build 3DSX
        run: make -C MiniOpenWorld3DS

      - name: Upload build intermediates
        uses: actions/upload-artifact@v4
        with:
          name: CITY-LIFE-3D-intermediate
          if-no-files-found: error
          path: |
            MiniOpenWorld3DS/MiniOpenWorld3DS.3dsx
            MiniOpenWorld3DS/MiniOpenWorld3DS.elf
            MiniOpenWorld3DS/MiniOpenWorld3DS.smdh
            MiniOpenWorld3DS/romfs/**

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download intermediates
        uses: actions/download-artifact@v4
        with:
          name: CITY-LIFE-3D-intermediate
          path: MiniOpenWorld3DS
      - name: Install makerom
        run: |
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 20 https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip -o /tmp/makerom.zip
          mkdir -p /tmp/makerom
          unzip -q /tmp/makerom.zip -d /tmp/makerom
          MAKEROM="$(find /tmp/makerom -type f -name makerom | head -n 1)"
          test -n "$MAKEROM"
          chmod +x "$MAKEROM"
      - name: Install 3dstool
        run: |
          mkdir -p /tmp/3dstool
          if curl --fail --location --retry 3 --retry-all-errors --retry-delay 3 --connect-timeout 20 https://github.com/dnasdw/3dstool/releases/download/v1.2.6/3dstool_linux_x86_64.tar.gz -o /tmp/3dstool.tar.gz; then
            tar -xzf /tmp/3dstool.tar.gz -C /tmp/3dstool
          else
            echo "Prebuilt download unavailable; compiling 3dstool v1.2.6 from source."
            sudo apt-get update
            sudo apt-get install -y cmake libssl-dev libcurl4-openssl-dev
            git clone --depth 1 --branch v1.2.6 https://github.com/dnasdw/3dstool.git /tmp/3dstool-src
            cmake -S /tmp/3dstool-src -B /tmp/3dstool-src/build -DUSE_DEP=OFF
            cmake --build /tmp/3dstool-src/build --parallel 2
            find /tmp/3dstool-src/build -type f -name 3dstool -exec cp {} /tmp/3dstool/3dstool \;
          fi
          TOOL="$(find /tmp/3dstool -type f -name 3dstool | head -n 1)"
          test -n "$TOOL"
          chmod +x "$TOOL"
          echo "$(dirname "$TOOL")" >> "$GITHUB_PATH"
      - name: Build RomFS image
        run: 3dstool -cvtf romfs MiniOpenWorld3DS/romfs.bin --romfs-dir MiniOpenWorld3DS/romfs

      - name: Package CIA
        run: |
          MAKEROM="$(find /tmp/makerom -type f -name makerom | head -n 1)"
          "$MAKEROM" -f cia -o CITY-LIFE-3D.cia -target t -elf MiniOpenWorld3DS/MiniOpenWorld3DS.elf -romfs MiniOpenWorld3DS/romfs.bin -rsf MiniOpenWorld3DS/cia.rsf -icon MiniOpenWorld3DS/MiniOpenWorld3DS.smdh -desc app:4 -exefslogo
          test -s CITY-LIFE-3D.cia
      - name: Upload installable files
        uses: actions/upload-artifact@v4
        with:
          name: CITY-LIFE-3D-CIA
          if-no-files-found: error
          path: |
            CITY-LIFE-3D.cia
            MiniOpenWorld3DS/MiniOpenWorld3DS.3dsx
      - name: Publish CIA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: city-life-3d-build-${{ github.run_number }}
          name: CITY LIFE 3D Build ${{ github.run_number }}
          body: Installierbare CIA fuer Nintendo 3DS. Download CITY-LIFE-3D.cia und installiere sie mit FBI.
          files: CITY-LIFE-3D.cia
          prerelease: true

      - name: Keep only the newest CIA release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentTag = `city-life-3d-build-${context.runNumber}`;
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            for (const release of releases.data) {
              if (release.tag_name === currentTag) continue;
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${release.tag_name}` });
              } catch (error) {
                core.warning(`Could not delete old tag ${release.tag_name}: ${error.message}`);
              }
            }
