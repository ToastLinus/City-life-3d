name: Bayreuth map data tests

on:
  push:
    branches:
      - main
    paths:
      - 'tools/fetch_bayreuth_map.py'
      - 'tests/**'
      - '.github/workflows/bayreuth-data-tests.yml'
  pull_request:
    paths:
      - 'tools/fetch_bayreuth_map.py'
      - 'tests/**'
      - '.github/workflows/bayreuth-data-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run geometry converter tests
        run: python -m unittest discover -s tests -v
